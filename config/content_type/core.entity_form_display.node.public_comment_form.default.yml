# Node edit form for a manual comment period. The URL alias widget (path) is
# deliberately present: the shareable link is /form/public-comment-form?nid=
# followed by this node's alias, so an editor has to be able to set one.
langcode: en
status: true
dependencies:
  config:
    - field.field.node.public_comment_form.field_dmr_pc_applicant_name
    - field.field.node.public_comment_form.field_dmr_pc_license_type
    - field.field.node.public_comment_form.field_dmr_pc_location
    - field.field.node.public_comment_form.field_dmr_pc_period_end
    - field.field.node.public_comment_form.field_dmr_pc_period_start
    - field.field.node.public_comment_form.field_dmr_pc_town
    - node.type.public_comment_form
  module:
    - datetime
    - path
id: node.public_comment_form.default
targetEntityType: node
bundle: public_comment_form
mode: default
content:
  created:
    type: datetime_timestamp
    weight: 20
    region: content
    settings: {  }
    third_party_settings: {  }
  field_dmr_pc_applicant_name:
    type: string_textfield
    weight: 1
    region: content
    settings:
      size: 60
      placeholder: ''
    third_party_settings: {  }
  field_dmr_pc_license_type:
    type: options_select
    weight: 4
    region: content
    settings: {  }
    third_party_settings: {  }
  field_dmr_pc_location:
    type: string_textfield
    weight: 3
    region: content
    settings:
      size: 60
      placeholder: ''
    third_party_settings: {  }
  field_dmr_pc_period_end:
    type: datetime_default
    weight: 6
    region: content
    settings: {  }
    third_party_settings: {  }
  field_dmr_pc_period_start:
    type: datetime_default
    weight: 5
    region: content
    settings: {  }
    third_party_settings: {  }
  field_dmr_pc_town:
    type: string_textfield
    weight: 2
    region: content
    settings:
      size: 60
      placeholder: ''
    third_party_settings: {  }
  path:
    type: path
    weight: 30
    region: content
    settings: {  }
    third_party_settings: {  }
  status:
    type: boolean_checkbox
    weight: 40
    region: content
    settings:
      display_label: true
    third_party_settings: {  }
  title:
    type: string_textfield
    weight: 0
    region: content
    settings:
      size: 60
      placeholder: ''
    third_party_settings: {  }
  uid:
    type: entity_reference_autocomplete
    weight: 21
    region: content
    settings:
      match_operator: CONTAINS
      match_limit: 10
      size: 60
      placeholder: ''
    third_party_settings: {  }
hidden:
  promote: true
  sticky: true

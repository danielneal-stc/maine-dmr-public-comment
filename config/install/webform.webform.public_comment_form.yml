handlers:
  comment_period_validation:
    id: comment_period_validation
    handler_id: comment_period_validation
    label: 'Comment period validation'
    notes: ''
    status: true
    conditions: {  }
    weight: 0
    settings: {  }
  comment_submission:
    id: comment_submission
    handler_id: comment_submission
    label: 'Comment submission'
    notes: ''
    status: true
    conditions: {  }
    weight: 0
    settings: {  }
  email:
    id: email
    handler_id: email
    label: 'Comment received confirmation (to the submitter)'
    notes: 'Goes to the address the visitor typed, in BOTH modes. Carries no submitted values and no attachments: everything a submitter is sent is fixed text. Deliberately says the comment was RECEIVED, not that it reached Pega, because this fires whether or not the Pega write succeeded.'
    status: true
    conditions: {  }
    weight: 10
    settings:
      states:
        - completed
      to_mail: '[webform_submission:values:email:raw]'
      to_options: {  }
      bcc_mail: ''
      bcc_options: {  }
      cc_mail: ''
      cc_options: {  }
      from_mail: _default
      from_options: {  }
      from_name: _default
      reply_to: ''
      return_path: ''
      sender_mail: ''
      sender_name: ''
      subject: 'Your public comment has been received'
      body: |
        Thank you for commenting on an aquaculture licensing application.

        Your comment has been received by the Maine Department of Marine Resources. No reply is needed and no action is required from you.

        If the page shown after you submitted included a red message and a reference code, please email dmraquaculture@maine.gov and quote that code so that staff can finish recording your comment.

        This message is sent automatically. Please do not reply to it.
      excluded_elements: {  }
      ignore_access: false
      exclude_empty: true
      exclude_empty_checkbox: false
      exclude_attachments: true
      html: false
      attachments: false
      twig: false
      theme_name: ''
      langcode: ''
      parameters: {  }
      debug: false
  email_1:
    id: email
    handler_id: email_1
    label: 'Staff notification: paper application (to dmraquaculture@maine.gov)'
    notes: 'nid mode only. There is no Pega record for a paper application, so this email IS the delivery mechanism: it carries the full submission and the uploaded files. It is addressed to the internal mailbox and nowhere else. Attachments are only ever emailed here, never to a submitter address.'
    status: true
    conditions:
      enabled:
        ':input[name="nid"]':
          filled: true
    weight: 10
    settings:
      states:
        - completed
      to_mail: dmraquaculture@maine.gov
      to_options: {  }
      bcc_mail: ''
      bcc_options: {  }
      cc_mail: ''
      cc_options: {  }
      from_mail: _default
      from_options: {  }
      from_name: _default
      reply_to: ''
      return_path: ''
      sender_mail: ''
      sender_name: ''
      subject: 'Public comment received: paper application (no Pega record)'
      body: |
        A public comment was submitted for a paper application, that is one that is not tracked in Pega.

        There is no Pega record for this comment. This email and the Drupal submission are the record of it. Any files the commenter uploaded are attached to this message and are also kept in Drupal.

        Submitted on [webform_submission:created]

        [webform_submission:values]
      excluded_elements: {  }
      ignore_access: true
      exclude_empty: true
      exclude_empty_checkbox: false
      exclude_attachments: false
      html: false
      attachments: true
      twig: false
      theme_name: ''
      langcode: ''
      parameters: {  }
      debug: false
  email_2:
    id: email
    handler_id: email_2
    label: 'Staff notification: Pega case (to dmraquaculture@maine.gov)'
    notes: 'case_id mode only. Form data with NO attachments. attachments MUST stay false: the comment_submission handler deletes the uploaded files as soon as Pega confirms storing them, and that runs before this handler, so attaching them would send a mail with silently missing files. The wording tells staff this email does not confirm the Pega write.'
    status: true
    conditions:
      enabled:
        ':input[name="case_id"]':
          filled: true
    weight: 10
    settings:
      states:
        - completed
      to_mail: dmraquaculture@maine.gov
      to_options: {  }
      bcc_mail: ''
      bcc_options: {  }
      cc_mail: ''
      cc_options: {  }
      from_mail: _default
      from_options: {  }
      from_name: _default
      reply_to: ''
      return_path: ''
      sender_mail: ''
      sender_name: ''
      subject: 'Public comment received: Pega case (confirm it in Pega)'
      body: |
        A public comment was submitted for an application that is tracked in Pega.

        The comment and any uploaded files are sent to Pega separately, and the files are then removed from Drupal, so nothing is attached to this email. This is a notification that a comment arrived, NOT confirmation that Pega accepted it.

        Check the case in Pega. If the comment is not there, see Reports -> Recent log messages, filtered to dmr_public_comment, and follow PART 8 of the installation guide.

        Submitted on [webform_submission:created]

        [webform_submission:values]
      excluded_elements: {  }
      ignore_access: true
      exclude_empty: true
      exclude_empty_checkbox: false
      exclude_attachments: true
      html: false
      attachments: false
      twig: false
      theme_name: ''
      langcode: ''
      parameters: {  }
      debug: false

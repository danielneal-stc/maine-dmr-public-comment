id: public_comment_form
title: 'Public Comment Form'
description: ''
categories: {  }
elements: |-
  case_details:
    '#type': webform_section
    '#title': 'Leave a Comment'
    applicant:
      '#type': textfield
      '#title': Applicant
      '#readonly': true
    town:
      '#type': textfield
      '#title': Town
      '#readonly': true
    location:
      '#type': textfield
      '#title': Location
      '#readonly': true
    comment_period:
      '#type': textfield
      '#title': 'Comment Period'
      '#readonly': true
    case_id:
      '#type': hidden
      '#title': 'Case ID'
      '#prepopulate': true
    nid:
      '#type': hidden
      '#title': nid
      '#prepopulate': true
    license_type:
      '#type': hidden
      '#title': 'License Type'
  your_information:
    '#type': webform_section
    '#title': 'Your Information'
    '#title_display': invisible
    full_name:
      '#type': textfield
      '#title': 'Full Name'
      '#required': true
    email:
      '#type': email
      '#title': Email
      '#required': true
    phone_number:
      '#type': tel
      '#title': 'Phone Number'
      '#required': true
      '#pattern': '^(\(\d{3}\)\s?\d{3}-\d{4}|\d{3}-\d{3}-\d{4}|\d{10})$'
      '#pattern_error': 'Please enter a valid phone number (e.g. 207-350-7815).'
    hearing_requested:
      '#type': checkbox
      '#title': 'I request a public hearing for this application.'
      '#title_display': invisible
      '#field_suffix': 'I request a public hearing for this application.'
      '#states':
        visible:
          ':input[name="license_type"]':
            value: 'Experimental Lease'
    comments:
      '#type': textarea
      '#title': Comments
      '#required': true
      '#rows': 8
      '#maxlength': 2500
      '#description': 'Up to 2,500 characters. If your comment is longer than that, please attach the full text as a PDF below.'
      '#access_update_roles': {  }
      '#access_view_roles':
        - authenticated
    attachments:
      '#type': managed_file
      '#title': Attachments
      '#multiple': true
      '#uri_scheme': private
      '#file_extensions': 'jpg jpeg png heic webp pdf'
    confirmtrue:
      '#type': checkbox
      '#title': 'I confirm that the comments submitted herein are truthful and accurate to the best of my knowledge.'
      '#title_display': invisible
      '#description_display': invisible
      '#field_suffix': 'I confirm that the comments submitted herein are truthful and accurate to the best of my knowledge.'
      '#required': true
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#update_hide': true
    '#delete__label': Cancel
css: |+
  .webform-submission-form {
    max-width: 700px;
    margin: 0 auto;
    padding: 2rem;
    font-family: sans-serif;
    font-size: 16px;
  }

  /* Form controls do not inherit the font above on their own: browsers apply
     their own defaults to them, and for a textarea that default is monospace.
     That is why the comment box used to look different from the other fields.
     Stated explicitly so every box on the form matches. */
  .webform-submission-form input,
  .webform-submission-form textarea,
  .webform-submission-form select {
    font-family: inherit;
    font-size: inherit;
  }

  /* Actions row */
  .webform-submission-form .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    margin-top: 1.5rem;
  }

  .form-required::after {
    content: " *";
    color: red;
  }

  /* Case Details 2-column grid */
  #edit-case-details .webform-section-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem 2rem;
  }

  #edit-case-details .js-form-item {
    display: flex;
    flex-direction: column;
  }

  #edit-case-details label {
    color: #666;
    font-size: 0.85rem;
    font-weight: normal;
    margin-bottom: 2px;
  }

  #edit-case-details input {
    border: none;
    background: transparent;
    font-weight: bold;
    font-size: 1rem;
    padding: 0;
    pointer-events: none;
  }

  /* Divider between sections */
  #edit-case-details {
    padding-bottom: 1.5rem;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid #ddd;
  }

  /* Remove the top border from Your Information */
  #edit-your-information {
    border-top: none;
    padding-top: 0;
    margin-top: 0;
  }

  /* Section headings */
  .webform-submission-form .webform-section-title {
    font-size: 1.1rem;
    font-weight: bold;
    margin-bottom: 1rem;
  }

  /* Email and Phone in 2 columns */
  #edit-email,
  #edit-phone-number {
    width: 100%;
  }

  .js-form-item-email,
  .js-form-item-phone-number {
    display: inline-block;
    width: 48%;
    vertical-align: top;
    margin-right: 2%;
  }

  .js-form-item-phone-number {
    margin-right: 0;
  }

  /* Input field spacing */
  #edit-your-information .js-form-item {
    margin-bottom: 1rem;
  }

  #edit-your-information label {
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 4px;
    display: block;
  }

  .webform-submission-form input[type="text"],
  .webform-submission-form input[type="email"],
  .webform-submission-form input[type="tel"],
  .webform-submission-form textarea {
    width: 100%;
    padding: 0.6rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 1rem;
    box-sizing: border-box;
  }

  /* Attachments - clean up */
  .webform-submission-form .js-form-type-managed-file input[type="file"] {
    display: block;
    width: 100%;
    padding: 2rem;
    border: 2px dashed #ccc;
    border-radius: 4px;
    text-align: center;
    cursor: pointer;
    box-sizing: border-box;
  }

  .webform-submission-form .description {
    font-size: 0.8rem;
    color: #666;
  }


  /* Submit button */
  .webform-submission-form .form-submit {
    background-color: #1a4480;
    color: white;
    padding: 0.65rem 2rem;
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 1rem;
  }

  /* Style the top error banner */
  .messages.messages--error {
    background-color: #fff0f0;
    border-left: 4px solid red;
    border-radius: 4px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
    color: #c00;
    font-size: 0.9rem;
  }

  [data-drupal-messages] [role="alert"] {
    background-color: #fff0f0;
    border-left: 4px solid red;
    border-radius: 4px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
    color: #c00;
    font-size: 0.9rem;
  }

